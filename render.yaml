services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: communitai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_REGION
        sync: false
      - key: DO_SPACES_BUCKET
        sync: false
      - key: DO_SPACES_ENDPOINT
        sync: false
      - key: AGENT_ENDPOINT_URL
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GRADIENT_API_KEY
        sync: false
      - key: GRADIENT_MODEL_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEMO_EMAIL
        value: demo@communitai.app
      - key: DEMO_PASSWORD
        sync: false

  # ── Agent (AI Pipeline) ──────────────────────────────────────────────────
  - type: web
    name: communitai-agent
    runtime: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_REGION
        sync: false
      - key: DO_SPACES_BUCKET
        sync: false
      - key: DO_SPACES_ENDPOINT
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GRADIENT_API_KEY
        sync: false
      - key: GRADIENT_MODEL_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
